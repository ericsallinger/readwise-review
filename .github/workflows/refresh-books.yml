name: Refresh books

on:
  schedule:
    - cron: '0 12 * * 0'   # Sunday 12:00 UTC
  workflow_dispatch:

concurrency:
  group: refresh-books
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e .
      - run: python -m readwise_review.refresh
        env:
          READWISE_TOKEN: ${{ secrets.READWISE_TOKEN }}
